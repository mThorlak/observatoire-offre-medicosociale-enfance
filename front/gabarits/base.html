<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>$titre — Observatoire de l'offre médico-sociale enfance</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f7f7f5;
    --panel: #ffffff;
    --texte: #1f2328;
    --texte-att: #57606a;
    --bordure: #d0d7de;
    --accent: #0969da;
    --actif: #1a7f37;
    --inactif: #cf222e;
    --barre: #6cb6ff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Arial, sans-serif;
    background: var(--bg);
    color: var(--texte);
  }
  header {
    padding: 1rem 1.5rem;
    background: var(--panel);
    border-bottom: 1px solid var(--bordure);
  }
  header h1 { margin: 0 0 .25rem; font-size: 1.25rem; }
  header p { margin: 0; color: var(--texte-att); font-size: .85rem; }
  nav { margin-top: .5rem; font-size: .85rem; }
  nav a { color: var(--accent); margin-right: 1rem; }
  main { padding: 1rem 1.5rem 2rem; max-width: 1200px; margin: 0 auto; }
  .filtres {
    display: flex;
    flex-wrap: wrap;
    gap: .75rem;
    background: var(--panel);
    border: 1px solid var(--bordure);
    border-radius: 8px;
    padding: .9rem 1rem;
    margin-bottom: 1rem;
    align-items: end;
  }
  .filtres[hidden] { display: none; }
  .filtres label {
    display: flex;
    flex-direction: column;
    font-size: .78rem;
    color: var(--texte-att);
    gap: .3rem;
  }
  .filtres select, .filtres input {
    font-size: .9rem;
    padding: .4rem .5rem;
    border: 1px solid var(--bordure);
    border-radius: 6px;
    min-width: 12rem;
    background: white;
  }
  .filtres button {
    font-size: .85rem;
    padding: .45rem .8rem;
    border: 1px solid var(--bordure);
    border-radius: 6px;
    background: var(--panel);
    cursor: pointer;
  }
  .compteur { font-size: .85rem; color: var(--texte-att); margin: .25rem 0 .75rem; }
  table {
    width: 100%;
    border-collapse: collapse;
    background: var(--panel);
    border: 1px solid var(--bordure);
    font-size: .88rem;
  }
  thead th {
    text-align: left;
    padding: .6rem .7rem;
    background: #f0f2f4;
    border-bottom: 1px solid var(--bordure);
    white-space: nowrap;
  }
  tbody td {
    padding: .5rem .7rem;
    border-bottom: 1px solid #eef0f2;
    vertical-align: top;
  }
  tbody tr:hover { background: #f6f8fa; }
  .code-brut { color: var(--texte-att); font-size: .78rem; }
  .vide { padding: 2rem; text-align: center; color: var(--texte-att); }
  footer { max-width: 1200px; margin: 1rem auto 2rem; padding: 0 1.5rem; font-size: .78rem; color: var(--texte-att); }
$style
</style>
</head>
<body>
<header>
  <h1>$titre</h1>
  <p>Observatoire national libre de l'offre médico-sociale enfance/adolescents — FINESS, millésime $millesime.</p>
  <nav><a href="liste.html">Établissements</a><a href="indicateur.html">Indicateur département × catégorie</a></nav>
</header>
<main>
$contenu
</main>
<footer>$pied</footer>
$script
</body>
</html>
