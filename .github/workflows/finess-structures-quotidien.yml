name: FINESS-Structures — téléchargement quotidien

# Automatise ce qu'aucune session Claude ne peut faire elle-même : le
# téléchargement quotidien de l'extrait FINESS-Structures est bloqué depuis
# les environnements d'exécution utilisés pour développer ce projet (accès
# réseau sortant restreint). Un runner GitHub Actions a un accès réseau
# normal, ce qui en fait un point d'exécution fiable pour cette tâche
# récurrente — voir docs/08_SOURCES_DONNEES.md, section "Procédure
# d'acquisition automatisée".
#
# Politique de rétention (décidée le 13/08/2026) :
#   - chaque fichier quotidien est archivé en artefact GitHub Actions,
#     conservé 35 jours puis supprimé automatiquement par GitHub ;
#   - le 1er de chaque mois, le fichier du jour est en plus publié comme
#     snapshot permanent (GitHub Release taguée AAAA-MM), qui n'expire pas.

"on":
  schedule:
    # 06:00 UTC, après la publication ANS observée vers 02:16 UTC.
    - cron: "0 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write  # requis pour publier le snapshot mensuel (gh release)

jobs:
  telecharger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Télécharger et vérifier l'extrait du jour
        id: telechargement
        run: |
          set -euo pipefail
          mkdir -p donnees/finess-structures
          JOUR="$(date -u +%Y%m%d)"
          FICHIER="donnees/finess-structures/finess-structures-${JOUR}.json.gz"
          python3 scripts/telecharger_finess_structures.py "$FICHIER"
          echo "fichier=$FICHIER" >> "$GITHUB_OUTPUT"

      - name: Archiver le fichier du jour (rétention glissante, 35 jours)
        uses: actions/upload-artifact@v4
        with:
          name: finess-structures-${{ github.run_id }}
          path: |
            donnees/finess-structures/*.json.gz
            donnees/finess-structures/*.json.gz.metadata.json
          retention-days: 35
          if-no-files-found: error

      - name: Publier le snapshot mensuel permanent (le 1er du mois)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          JOUR="$(date -u +%d)"
          if [ "$JOUR" != "01" ]; then
            echo "Pas le 1er du mois (jour=$JOUR) — pas de snapshot mensuel aujourd'hui."
            exit 0
          fi
          MOIS="$(date -u +%Y-%m)"
          TAG="finess-structures-${MOIS}"
          FICHIER="${{ steps.telechargement.outputs.fichier }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$FICHIER" --clobber
          else
            gh release create "$TAG" "$FICHIER" \
              --title "FINESS-Structures ${MOIS}" \
              --notes "Snapshot mensuel permanent, téléchargé et vérifié automatiquement le $(date -u +%Y-%m-%d). Voir docs/08_SOURCES_DONNEES.md."
          fi
